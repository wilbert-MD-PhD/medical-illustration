name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release.py check
      - run: python plugins/medical-illustration/skills/medical-illustration/scripts/test_init_medical_project.py
      - run: python scripts/test_release.py
      - run: python scripts/release.py build
      - uses: actions/upload-artifact@v4
        with:
          name: skill-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
